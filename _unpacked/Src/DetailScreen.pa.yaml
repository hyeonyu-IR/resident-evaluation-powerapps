            PaddingBottom: =15
            PaddingLeft: =7
            PaddingRight: =7
            PaddingTop: =15
            Width: =88
            X: =552
      - contDeleteWarning:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(210, 210, 210, 1)
            Visible: |-
              =
              varShowDeleteConfirm
            X: =76
            Y: =96
          Children:
            - lblWarningText:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(197, 203, 207, 1)
                  Color: =RGBA(29, 29, 29, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Size: =16
                  Text: |-
                    ="WARNING: Deleting this record is permanent and cannot be undone."
                  Width: =500
                  Y: =40
            - btnConfirm:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(210, 210, 210, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  Font: =Font.'Open Sans'
                  Height: =50
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  OnSelect: |+
                    =If(
                        gblIsProgramDirector || varSelRecord.Author.Email = gblCurrentUserEmail,
                        Remove(VIR_RealTime_FeedBack, varSelRecord);
                        Notify("Record deleted permanently.", NotificationType.Warning, 1000);
                        Set(varShowDeleteConfirm, false);
                        If(
                            sourceGallery = "screen_me",
                            Navigate(BrowseScreen_me, ScreenTransition.Fade),
                            Navigate(BrowseScreen_all, ScreenTransition.Fade)
                        ),
                        Notify("You are not allowed to delete this record.", NotificationType.Error, 2000);
                        Set(varShowDeleteConfirm, false)
                    );
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =16
                  Text: ="Confirm"
                  Width: =150
                  X: =59
                  Y: =145
            - btnCancel:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(210, 210, 210, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  Font: =Font.'Open Sans'
                  Height: =50
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  OnSelect: |-
                    =Set(varShowDeleteConfirm, false);
                    Notify("Deletion canceled.", NotificationType.Information, 1000);
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =16
                  Text: ="Cancel"
                  Width: =150
                  X: =296
                  Y: =145
