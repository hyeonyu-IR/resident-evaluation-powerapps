Screens:
  DetailScreen:
    Properties:
      Fill: =RGBA(0, 0, 0, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
      OnVisible: |-
        =Set(gblCurrentUserEmail, User().Email);
        Set(gblCurrentUserFullName, User().FullName);
        Set(
            gblEPAOptions1,
            Table(
                { Value: "", Score: Blank() }, // blank default line
                { Value: "Level 1: Limited Participation", Score: 1 },
                { Value: "Level 2: Direct Supervision",   Score: 2 },
                { Value: "Level 3: Indirect Supervision", Score: 3 },
                { Value: "Level 4: Practice Ready",       Score: 4 }
            )
        );

        If(!IsBlank(selRecord), Set(varSelRecord, selRecord), varSelRecord);
        If(!IsBlank(sourceGallery), Set(varSourceGallery, sourceGallery), varSourceGallery);
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - lbl_Date_Attending:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(153, 207, 236, 1)
            Color: =RGBA(43, 43, 45, 1)
            Fill: =RGBA(45, 46, 48, 1)
            FocusedBorderColor: =lbl_Date_Attending.BorderColor
            Font: =Font.'Open Sans'
            Height: =110
            HoverBorderColor: =lbl_Date_Attending.BorderColor
            HoverColor: =lbl_Date_Attending.Color
            HoverFill: =lbl_Date_Attending.Fill
            PressedBorderColor: =lbl_Date_Attending.BorderColor
            PressedColor: =lbl_Date_Attending.Color
            PressedFill: =lbl_Date_Attending.Fill
            Text: =""
            Width: =606
            X: =16
            Y: =100
      - RectQuickActionBar2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =RectQuickActionBar2.BorderColor
            Height: =88
            Width: =Parent.Width
      - IconDelete1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =IconDelete1.Tooltip
            BorderColor: =RGBA(197, 203, 207, 1)
            Color: =RGBA(43, 52, 58, 1)
            DisabledFill: =IconDelete1.Fill
            DisplayMode: =If((gblIsProgramDirector || varSelRecord.Author.Email = gblCurrentUserEmail) && DataSourceInfo(VIR_RealTime_FeedBack, DataSourceInfo.DeletePermission), DisplayMode.Edit, DisplayMode.Disabled)
            FocusedBorderColor: =IconDelete1.BorderColor
            Height: =88
            HoverBorderColor: =ColorFade(IconDelete1.BorderColor, 20%)
            HoverColor: =ColorFade(IconDelete1.Color, 20%)
            HoverFill: =IconDelete1.Fill
            Icon: =Icon.Trash
            OnSelect: |+
              =//Remove(VIR_RealTime_FeedBack, varSelRecord); If (IsEmpty(Errors(VIR_RealTime_FeedBack, varSelRecord)), Back())

              // Show a confirmation dialog instead of calling Confirm()
              Set(varShowDeleteConfirm, true);

            PaddingBottom: =20
            PaddingLeft: =20
            PaddingRight: =20
            PaddingTop: =20
            PressedBorderColor: =ColorFade(IconDelete1.BorderColor, -20%)
            PressedColor: =ColorFade(IconDelete1.Color, -30%)
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Delete this item"
            Width: =88
            X: =464
      - LblAppName2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            FocusedBorderColor: =LblAppName2.BorderColor
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =88
