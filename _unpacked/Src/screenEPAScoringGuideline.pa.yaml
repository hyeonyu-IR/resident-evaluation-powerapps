Screens:
  screenEPAScoringGuideline:
    Properties:
      Fill: =RGBA(0, 0, 0, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
      OnVisible: =If(IsBlank(varEPA), Set(varEPA, Blank()))
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - RectQuickActionBar3_2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =RectQuickActionBar3_2.BorderColor
            Height: =88
            Width: =Parent.Width
      - LblAppName2_2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            FocusedBorderColor: =LblAppName2_2.BorderColor
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =88
            HoverBorderColor: =LblAppName2_2.BorderColor
            HoverColor: =LblAppName2_2.Color
            HoverFill: =LblAppName2_2.Fill
            PressedBorderColor: =LblAppName2_2.BorderColor
            PressedColor: =LblAppName2_2.Color
            PressedFill: =LblAppName2_2.Fill
            Text: ="Entrustable Professional Activities"
            Width: =537
            Wrap: =false
            X: =102
      - Timer1_1:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =1000
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =Timer1_1.BorderColor
            Font: =Font.'Open Sans'
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
            OnTimerEnd: |-
              =UpdateContext({TimeNow: Text(Now(), "[$-en-US] hh:mm:ss AM/PM")})
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Repeat: =true
            Text: =Text(Time(0, 0, Timer1_1.Value/1000), "hh:mm:ss")
            Visible: =false
            X: =180
            Y: =325
      - conAEHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =100
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingTop: =20
            Width: =638
            X: =1
            Y: =150
          Children:
            - level1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  FocusedBorderColor: =ColorFade(Self.Fill, 75%)
                  Font: =Font.'Open Sans'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: =Set(varEPA, "Level1")
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =14
                  Text: ="Level 1"
                  Width: =140
                  X: =40
                  Y: =137
            - level2:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  FocusedBorderColor: =ColorFade(Self.Fill, 75%)
                  Font: =Font.'Open Sans'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: =Set(varEPA, "Level2")
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =14
                  Text: ="Level 2"
                  Width: =140
                  X: =40
                  Y: =62
            - level3:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  FocusedBorderColor: =ColorFade(Self.Fill, 75%)
                  Font: =Font.'Open Sans'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: =Set(varEPA, "Level3")
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =14
                  Text: ="Level 3"
                  Width: =140
                  X: =40
                  Y: =125
            - level4:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(100, 118, 132, 1)
                  FocusedBorderColor: =ColorFade(Self.Fill, 75%)
                  Font: =Font.'Open Sans'
                  Height: =60
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
                  LayoutMaxHeight: =
                  LayoutMaxWidth: =
                  OnSelect: =Set(varEPA, "Level4")
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =14
