Screens:
  screenFeedback:
    Properties:
      Fill: =RGBA(29, 29, 29, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
      OnVisible: |-
        =Set(gblCurrentUserEmail, User().Email);
        Set(gblCurrentUserFullName, User().FullName);
        Set(
            gblEPAOptions,
            Table(
                { Value: "", Score: Blank() }, // blank default line
                { Value: "Level 1: Limited Participation", Score: 1 },
                { Value: "Level 2: Direct Supervision",   Score: 2 },
                { Value: "Level 3: Indirect Supervision", Score: 3 },
                { Value: "Level 4: Practice Ready",       Score: 4 }
            )
        );

        // ScreenFeedback.OnVisible
        Refresh(VIR_RealTime_FeedBack); // ensure we have the latest

        Set(
            varNextSerial,
            Coalesce(
                First(
                    SortByColumns(VIR_RealTime_FeedBack, "ID", SortOrder.Descending)
                ).ID,
                0
            ) + 1
        );

        // Decide mode strictly from incoming selRecord
        Set(varSourceGallery, Coalesce(sourceGallery, varSourceGallery));
        Set(varSelRecord, Coalesce(selRecord, varSelRecord));
        Set(varNavMode, Lower(Coalesce(navMode, varNavMode)));

        If(varNavMode = "new",
            NewForm(frmFeedback),
            EditForm(frmFeedback)
        );
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - RectQuickActionBar3_1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =RectQuickActionBar3_1.BorderColor
            Height: =88
            Width: =Parent.Width
      - IconAccept1_1:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =IconAccept1_1.Tooltip
            BorderColor: =RGBA(197, 203, 207, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledFill: =IconAccept1_1.Fill
            FocusedBorderColor: =IconAccept1_1.BorderColor
            Height: =88
            HoverBorderColor: =ColorFade(IconAccept1_1.BorderColor, 20%)
            HoverColor: =ColorFade(IconAccept1_1.Color, 20%)
            HoverFill: =IconAccept1_1.Fill
            Icon: =Icon.Check
            OnSelect: =SubmitForm(frmFeedback)
            PaddingBottom: =22
            PaddingLeft: =22
            PaddingRight: =22
            PaddingTop: =22
            PressedBorderColor: =ColorFade(IconAccept1_1.BorderColor, -20%)
            PressedColor: =ColorFade(IconAccept1_1.Color, -30%)
            PressedFill: =RGBA(255, 255, 255, 0.3)
            TabIndex: =0
            Tooltip: ="Submit item"
            Width: =88
            X: =Parent.Width - IconAccept1_1.Width
      - frmFeedback:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            DataSource: =VIR_RealTime_FeedBack
            Fill: =RGBA(0, 0, 0, 1)
            Height: =Parent.Height - frmFeedback.Y
            Item: |-
              =// Critical: do NOT use BrowseGallery_me.Selected or ThisItem
              varSelRecord
            NumberOfColumns: =2
            OnSuccess: |+
              =Set(varSelRecord, Self.LastSubmit);

              Navigate(
                  DetailScreen,
                  ScreenTransition.None,
