      - imgEmail_all:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            DisplayMode: |-
              =If(
                  varHasGenerated && !IsBlank(varHtml_final),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            FocusedBorderColor: =imgEmail_all.BorderColor
            Height: =80
            Image: =email
            OnSelect: |-
              =//Office365.SendEmail(User().Email, "Feedback Report for " & ddlResidentYear_all.SelectedText.Value & "-Year Resident, " & ddlResidentName_all.SelectedText.ResidentName, html_all.HtmlText, {IsHtml: true, Importance: FontWeight.Normal});

              If(
                  IsBlank(varHtml_final),
                  Notify("Please click Generate to build the report before sending.", NotificationType.Warning, 2000),
                  // else: proceed to send
                  Office365.SendEmail(
                      User().Email,
                      "Resident Feedback Summary from All Attending",
                      html_all.HtmlText, { IsHtml: true });
                  Notify("Email sent.", NotificationType.Success, 1500)
              );
            Tooltip: |+
              =If(
                  varHasGenerated && !IsBlank(varHtml_final),
                  "Send the generated report to your email",
                  "Please select resident year & name and touch Generate before sending"
              )
            Width: =80
            X: =535
            Y: =1000
      - btnReportGenerator:
          Control: Classic/Button@2.2.0
          Properties:
            Align: =Align.Right
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =ColorFade(Self.Fill, 75%)
            Font: =Font.'Open Sans'
            Height: =50
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(100, 118, 132, 1), -20%)
            OnSelect: |+
              =// Creating html.text for email to myself.

              // Screen = ScreenFeedbackReport
              // Dropdown list = ddlResidentName
              // OnChange =

              Set(
                  varHtml_all,
                  With(
                      {
                          _year: ddlResidentYear_all.Selected.Value,
                          _name: ddlResidentName_all.Selected.ResidentName,            
                          _start: dpStart_all.SelectedDate,
                          _end: dpEnd_all.SelectedDate,
                          _endExcl: DateAdd(dpEnd_all.SelectedDate, 1, TimeUnit.Days),

                          // Filtered rows for this resident/year/dates (end date inclusive via < _endExcl)
                          _rows: Filter(
                              VIR_RealTime_FeedBack,
                              ResidentYear = ddlResidentYear_all.Selected.Value,
                              ResidentName = ddlResidentName_all.Selected.ResidentName,
                              EvalDate >= dpStart_all.SelectedDate && EvalDate < DateAdd(dpEnd_all.SelectedDate, 1, TimeUnit.Days)
                              // Attending = User().FullName //remove this line if you want all attendings’ feedback
                          )
                      },
                      With(
                          {
                              _total: CountRows(_rows),
                              _avgAll: Round(Average(_rows, AverageScore), 2),
                              // === Per-procedure grouping with phase averages and overall average ===
                              _procGrouped:
                                  AddColumns(
                                      GroupBy(_rows, ProcedureName, ProcedureSub, grp),
                                      Count, CountRows(grp),

                                      // Phase averages (EPA values "1"–"4" stored as text; cast with Value)
                                      NP_Avg,
                                          If(
                                              CountIf(grp, !IsBlank(Non_Preoperative)) > 0,
                                              Round(Average(Filter(grp, !IsBlank(Non_Preoperative)), Value(Non_Preoperative)), 2),
                                              Blank()
                                          ),
                                      IO_Avg,
                                          If(
                                              CountIf(grp, !IsBlank(Intraoperative)) > 0,
                                              Round(Average(Filter(grp, !IsBlank(Intraoperative)), Value(Intraoperative)), 2),
                                              Blank()
                                          ),
                                      PO_Avg,
                                          If(
                                              CountIf(grp, !IsBlank(Postoperative)) > 0,
                                              Round(Average(Filter(grp, !IsBlank(Postoperative)), Value(Postoperative)), 2),
                                              Blank()
                                          ),

                                      // Overall per-procedure average from numeric AverageScore
                                      Proc_Avg,
                                          If(
                                              CountIf(grp, !IsBlank(AverageScore)) > 0,
                                              Round(Average(Filter(grp, !IsBlank(AverageScore)), AverageScore), 2),
                                              Blank()
                                          )
                                  ),

                              // === Overall EPA distribution across all filtered rows ===
                              _np1: CountIf(_rows, Non_Preoperative = "1"),
                              _np2: CountIf(_rows, Non_Preoperative = "2"),
                              _np3: CountIf(_rows, Non_Preoperative = "3"),
                              _np4: CountIf(_rows, Non_Preoperative = "4"),
                              _io1: CountIf(_rows, Intraoperative = "1"),
                              _io2: CountIf(_rows, Intraoperative = "2"),
                              _io3: CountIf(_rows, Intraoperative = "3"),
                              _io4: CountIf(_rows, Intraoperative = "4"),
                              _po1: CountIf(_rows, Postoperative = "1"),
                              _po2: CountIf(_rows, Postoperative = "2"),
                              _po3: CountIf(_rows, Postoperative = "3"),
                              _po4: CountIf(_rows, Postoperative = "4")               

                          },

                          "<style>
                              table{border-collapse:collapse;font-family:'Segoe UI',Arial,sans-serif;font-size:12px}
                              th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}
                              th{background:#f5f6f8}
                              h2,h3{font-family:'Segoe UI',Arial}
                              .muted{color:#666}
                            </style>" &

                          "<h2>VIR Resident Feedback Summary</h2>" &
                          "<p><b>Resident:</b> " & _name & " (" & _year & ")<br/>" &
                              "<b>Period:</b> " & Text(_start, "[$-en-US]mmm d, yyyy") & " – " & Text(_end, "[$-en-US]mmm d, yyyy") & "<br/>" &
                              "<b>Total cases:</b> " & _total &
                              If(!IsBlank(_avgAll), " &nbsp; <b>Overall Avg Score:</b> " & Text(_avgAll, "0.00"), "") &
                          "</p>" &

                          If(
                              _total = 0,
                              "<p class='muted'>No evaluations found for the selected filters.</p>",

                              // ---------- Procedure List (with per-phase and overall averages) ----------
                              "<hr style='border:0; height:1px; background:#ccc; margin:20px 0;'/>" &
                              "<h3>Procedure List</h3>" &
                              "<table><tr>" &
                                  "<th>Main Category</th><th>Subcategory</th><th>Count</th>" &
                                  "<th>Pre-OP (avg)</th>" &
                                  "<th>Intra-OP (avg)</th>" &
                                  "<th>Post-OP (avg)</th>" &
                                  "<th>Avg Score</th>" &
                              "</tr>" &
                              Concat(
                                  SortByColumns(_procGrouped, "Count", SortOrder.Descending),                    

                                  "<tr>" &
                                      "<td>" & Coalesce(ProcedureName, "(blank)") & "</td>" &
                                      "<td>" & Coalesce(ProcedureSub, "(blank)") & "</td>" &
                                      "<td>" & Count & "</td>" &
                                      "<td>" & If(IsBlank(NP_Avg), "-", Text(NP_Avg, "0.00")) & "</td>" &
                                      "<td>" & If(IsBlank(IO_Avg), "-", Text(IO_Avg, "0.00")) & "</td>" &
                                      "<td>" & If(IsBlank(PO_Avg), "-", Text(PO_Avg, "0.00")) & "</td>" &
                                      "<td>" & If(IsBlank(Proc_Avg), "-", Text(Proc_Avg, "0.00")) & "</td>" &
                                  "</tr>"
                              ) &
                              "</table>" &

                              // ---------- EPA Distribution (overall counts) ----------               
                              "<hr style='border:0; height:1px; background:#ccc; margin:20px 0;'/>" &         
                              "<h3>EPAs Score Distribution (counts)</h3>" &                
                              "<p style='margin:6px 0 8px 0;'><b>EPAs Levels (reference)</b>" &
                              "<ul style='margin:0;padding-left:18px;font-family:&quot;Segoe UI&quot;,Arial,sans-serif;font-size:12px;'>" &
                                  "<li><b>Level 1:</b> Limited Participation</li>" &
                                  "<li><b>Level 2:</b> Direct Supervision</li>" &
                                  "<li><b>Level 3:</b> Indirect Supervision</li>" &
                                  "<li><b>Level 4:</b> Practice Ready</li>" &
                              "</ul></p>" &


                              "<table><tr><th>Level Score</th><th>Level 1</th><th>Level 2</th><th>Level 3</th><th>Level 4</th></tr>" &
                                  "<tr><td>Non‑Preoperative</td><td>" & _np1 & "</td><td>" & _np2 & "</td><td>" & _np3 & "</td><td>" & _np4 & "</td></tr>" &
                                  "<tr><td>Intraoperative</td><td>" & _io1 & "</td><td>" & _io2 & "</td><td>" & _io3 & "</td><td>" & _io4 & "</td></tr>" &
                                  "<tr><td>Postoperative</td><td>" & _po1 & "</td><td>" & _po2 & "</td><td>" & _po3 & "</td><td>" & _po4 & "</td></tr>" &
                              "</table>"
                          )
                      )
                  )
              );



              Set(
                  varHtml_attendingOnly,
                  With(
                      {
                          _year:  ddlResidentYear_all.Selected.Value,
                          _name:  ddlResidentName_all.Selected.ResidentName,
                          _start: dpStart_all.SelectedDate,
                          _end:   dpEnd_all.SelectedDate,

                          _rows: Filter(
                              VIR_RealTime_FeedBack,
                              ResidentYear = ddlResidentYear_all.Selected.Value,
                              ResidentName = ddlResidentName_all.Selected.ResidentName,
                              EvalDate >= dpStart_all.SelectedDate &&
                              EvalDate <  DateAdd(dpEnd_all.SelectedDate, 1, TimeUnit.Days)
                              // Do NOT filter out blank comments; we want all rows
                          )
                      },
                      With(
                          {
                              _rowsForAttending:
                                  AddColumns(
                                      _rows,
                                      AttendingText, Coalesce(Attending, "(unknown)"),
                                      AttendingHtml,
                                          Substitute(
                                              Substitute(
                                                  Substitute(Coalesce(Attending, "(unknown)"), "&", "&amp;"),
                                                  "<", "&lt;"
                                              ),
                                              ">", "&gt;"
                                          ),
                                      ProcMainText, Coalesce(ProcedureName, "(blank)"),
                                      ProcMainHtml,
                                          Substitute(
                                              Substitute(
                                                  Substitute(Coalesce(ProcedureName, "(blank)"), "&", "&amp;"),
                                                  "<", "&lt;"
                                              ),
                                              ">", "&gt;"
                                          ),
                                      ProcSubText, Coalesce(ProcedureSub, "(blank)"),
                                      ProcSubHtml,
                                          Substitute(
                                              Substitute(
                                                  Substitute(Coalesce(ProcedureSub, "(blank)"), "&", "&amp;"),
                                                  "<", "&lt;"
                                              ),
                                              ">", "&gt;"
                                          ),
                                      CommentText,
                                          With(
                                              { _c: Coalesce(Comment, "") },
                                              Substitute(
                                                  Substitute(
                                                      Substitute(
                                                          Substitute(_c, "&", "&amp;"),
                                                          "<", "&lt;"
                                                      ),
                                                      ">", "&gt;"
                                                  ),
                                                  Char(10), "<br/>"
                                              )
                                          )
                                  )
                          },
                          "<style>
                              table{border-collapse:collapse;font-family:'Segoe UI',Arial,sans-serif;font-size:12px}
                              th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}
                              th{background:#f5f6f8}
                              h2,h3{font-family:'Segoe UI',Arial}
                              .muted{color:#666}
                            </style>" &

                          "<hr style='border:0; height:1px; background:#ccc; margin:20px 0;'/>" &
                          "<h3>Attending Feedback &amp; Comments</h3>" &
                          //"<p><b>Resident:</b> " & _name & " (" & _year & ")<br/>" &
                              //"<b>Period:</b> " & Text(_start, "[$-en-US]mmm d, yyyy") & " – " & Text(_end, "[$-en-US]mmm d, yyyy") &
                          "</p>" &
                          If(
                              CountRows(_rowsForAttending) = 0,
                              "<p class='muted'>No evaluations found for the selected filters.</p>",
                              "<table>" &
                                  "<tr>" &
                                      "<th>Attending</th>" &
                                      "<th>Feedback Date</th>" &
                                      "<th>Procedure Main</th>" &
                                      "<th>Procedure Sub</th>" &
                                      "<th>Avg Score</th>" &
                                      "<th>Comment</th>" &
                                  "</tr>" &
                                  Concat(
                                      SortByColumns(
                                          _rowsForAttending,
                                          "Attending", SortOrder.Ascending,
                                          "EvalDate",      SortOrder.Ascending
                                      ),
                                      "<tr>" &
                                          "<td>" & Attending & "</td>" &
                                          "<td>" & Text(EvalDate, "[$-en-US]mmm d, yyyy") & "</td>" &
                                          "<td>" & ProcMainText & "</td>" &
                                          "<td>" & ProcSubText & "</td>" &
                                          "<td>" &
                                              If(
                                                  IsBlank(AverageScore),
                                                  "-",
                                                  Text(AverageScore, "0.00")
                                              ) &
                                          "</td>" &
                                          "<td>" &
                                              If(
                                                  IsBlank(Comment),
                                                  "–",
                                                  Comment
                                              ) &
                                          "</td>" &
                                      "</tr>"
                                  ) &
                              "</table>"
                          )
                      )
                  )
              );

              Set(
                  varHtml_final,
                  varHtml_all & varHtml_attendingOnly
              );

              // Or place it wherever you want in the final string.


              // Mark as generated
              Set(varHasGenerated, !IsBlank(varHtml_final));
              If(IsBlank(ddlResidentYear_all.Selected.Value), Notify("Please select a resident first.", NotificationType.Warning, 2000), Notify("Report generated. You can now send the email.", NotificationType.Success, 2000));

            PaddingRight: =10
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Generate Report for " & ddlResidentName_all.SelectedText.ResidentName
            Width: =500
            X: =25
            Y: =1015
