Screens:
  screenFeedbackReport_all:
    Properties:
      Fill: =RGBA(0, 0, 0, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
      OnVisible: |+
        =Set(gblCurrentUserEmail, User().Email);
        Set(gblCurrentUserFullName, User().FullName);
        If(
            !gblIsProgramDirector,
            Notify("This report is available only for program leadership.", NotificationType.Error, 2000);
            Navigate(Screen_Home, ScreenTransition.None)
        );
        Reset(ddlResidentYear_all);
        Reset(ddlResidentName_all);

        UpdateContext({
            ctxStartDate: DateAdd(Today(), -30),
            ctxEndDate: Today()
        });
        Reset(dpStart_all);
        Reset(dpEnd_all);

        // Clear any stale HTML when user enters the screen
        Set(varHtml_all, Blank());
        Set(varHtml_attendingOnly, Blank());
        Set(varHtml_final, Blank());
        Set(varHasGenerated, false);



      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - RectQuickActionBar3_5:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(197, 203, 207, 1)
            Fill: =RGBA(100, 118, 132, 1)
            FocusedBorderColor: =RectQuickActionBar3_5.BorderColor
            Height: =88
            Width: =Parent.Width
      - LblAppName3_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 0, 0, 1)
            Fill: =RGBA(58, 58, 58, 0)
            FocusedBorderColor: =LblAppName3_5.BorderColor
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =88
            HoverBorderColor: =LblAppName3_5.BorderColor
            HoverColor: =LblAppName3_5.Color
            HoverFill: =LblAppName3_5.Fill
            PressedBorderColor: =LblAppName3_5.BorderColor
            PressedColor: =LblAppName3_5.Color
            PressedFill: =LblAppName3_5.Fill
            Size: =24
            Text: ="All Attending Feedback"
            Width: =462
            Wrap: =false
            X: =88
      - IconSortUpDown1_3:
          Control: Classic/Icon@2.5.0
          Properties:
            AccessibleLabel: =IconSortUpDown1_3.Tooltip
            BorderColor: =RGBA(197, 203, 207, 1)
            Color: =RGBA(43, 52, 58, 1)
