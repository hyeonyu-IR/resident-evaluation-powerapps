            FocusedBorderColor: =IconSortUpDown1_3.BorderColor
            Height: =88
            HoverBorderColor: =ColorFade(IconSortUpDown1_3.BorderColor, 20%)
            HoverColor: =ColorFade(IconSortUpDown1_3.Color, 20%)
            HoverFill: =IconSortUpDown1_3.Fill
            Icon: =Icon.Sort
            OnSelect: |-
              =UpdateContext({SortDescending1: !SortDescending1})
            PaddingBottom: =26
            PaddingLeft: =26
            PaddingRight: =26
            PaddingTop: =26
            PressedBorderColor: =ColorFade(IconSortUpDown1_3.BorderColor, -20%)
            PressedColor: =ColorFade(IconSortUpDown1_3.Color, -30%)
