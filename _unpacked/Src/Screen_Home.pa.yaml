          Properties:
            Align: =LayoutAlignItems.Center
            BorderColor: =RGBA(197, 203, 207, 1)
            Color: =RGBA(0, 121, 187, 1)
            FocusedBorderColor: =lblTime.BorderColor
            Font: =Font.Lato
            Height: =40
            HoverBorderColor: =lblTime.BorderColor
            HoverColor: =lblTime.Color
            HoverFill: =lblTime.Fill
            PaddingBottom: =2
