Screens:
  Screen_Home:
    Properties:
      Fill: =RGBA(0, 0, 0, 1)
      Height: =Max(App.Height, App.DesignHeight)
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
      OnVisible: |+
        =UpdateContext({DateNow:Text(Now(),"[$-en-US]dddd mm/dd/yyyy")}); UpdateContext({TimeNow: Text(Now(), "[$-en-US] hh:mm:ss AM/PM")});
        Set(gblCurrentUserEmail, User().Email);
        Set(gblCurrentUserFullName, User().FullName);

        // Screen_Home.OnVisible
        Refresh(AttendingList);

        With(
            {
                me: LookUp(
                    AttendingList,
                    EmailAddress = gblCurrentUserEmail
                )
            },
            Set(
                gblIsProgramDirector,
                !IsBlank(me) &&
                (
                    Lower(Trim(me.AttendingRole)) = "program director" ||
                    Lower(Trim(me.AttendingRole)) = "pd" ||
                    Lower(Trim(me.AttendingRole)) = "program dir" ||
                    Lower(Trim(me.AttendingRole)) = "chair" ||
                    Lower(Trim(me.AttendingRole)) = "division chief" ||
                    Lower(Trim(me.AttendingRole)) = "admin" ||
                    Lower(Trim(me.AttendingRole)) = "administrator"
                )
            )
        );
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - lblDate:
          Control: Label@2.5.1
          Properties:
            Align: =LayoutAlignItems.Center
            BorderColor: =RGBA(197, 203, 207, 1)
            Color: =RGBA(0, 121, 187, 1)
            FocusedBorderColor: =lblDate.BorderColor
            Font: =Font.'Open Sans'
            Height: =40
            HoverBorderColor: =lblDate.BorderColor
            HoverColor: =lblDate.Color
            HoverFill: =lblDate.Fill
            PaddingBottom: =2
            PaddingTop: =2
            PressedBorderColor: =lblDate.BorderColor
            PressedColor: =lblDate.Color
            PressedFill: =lblDate.Fill
            Size: =18
            Text: =DateNow
            X: =40
            Y: =205
      - lblTime:
